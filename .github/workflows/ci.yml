name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install from lockfile
        run: npm ci

      - name: Verify Next's vendored dependency is intact
        run: node -e "const m = require('next/dist/compiled/fresh'); if (typeof m !== 'function') { throw new Error('next/dist/compiled/fresh did not resolve to a function'); } console.log('next/dist/compiled/fresh OK');"

      - name: Build
        run: npm run build

      - name: Verify static export output
        run: |
          test -f out/index.html || { echo "::error::out/index.html missing from static export"; exit 1; }

      - name: Guard Cloudflare Pages 25 MiB single-file limit
        run: |
          oversized=$(find out -type f -size +25M)
          if [ -n "$oversized" ]; then
            echo "::error::Found files exceeding Cloudflare Pages 25 MiB single-file limit:"
            echo "$oversized"
            exit 1
          fi
          echo "All exported assets are within Cloudflare Pages 25 MiB limit."

      - name: Report installed versions
        run: npm ls next react react-dom --depth=0
