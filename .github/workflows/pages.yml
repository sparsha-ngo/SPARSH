name: Deploy to GitHub Pages

# Manual for now: this needs the repository's Pages source set to
# "GitHub Actions" (Settings -> Pages); while it is set to a branch, the
# built-in branch build publishes the repository root instead.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install from lockfile
        run: npm ci

      - name: Build static export
        run: npm run build

      - name: Confirm the export was produced
        run: |
          test -f out/index.html
          test -f out/bye-laws/index.html
          test -f out/memorandum/index.html
          test -f out/images/sparsha-logo.png
          ls out

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
